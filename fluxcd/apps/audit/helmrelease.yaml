apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audit
  namespace: audit
spec:
  interval: 1m
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./helm/audit
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    image:
      repository: agilesolutions/audit
      tag: 1.0.15
    service:
      port: 8080
    ingress:
      enabled: true
      className: traefik
      host: audit.local
